<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Check-In</title>
  <link rel="stylesheet" href="chat-widget.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .demo-header {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 20px 24px;
      text-align: center;
    }
    .demo-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #2e86c1;
    }
    .demo-header p {
      font-size: 13px;
      color: #888;
      margin-top: 4px;
    }
    .demo-card {
      margin: 40px auto;
      max-width: 440px;
      width: 90%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 32px 28px;
    }
    .demo-card h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .demo-card .sub {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
    }
    .demo-field { margin-bottom: 18px; }
    .demo-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #555;
    }
    .demo-field input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .demo-field input:focus { border-color: #2e86c1; }
    .demo-btn {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #2e86c1;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .demo-btn:hover { background: #1f6fa0; }
    .demo-btn:disabled { background: #b0c4d8; cursor: not-allowed; }
    .demo-status {
      margin-top: 16px;
      font-size: 13px;
      color: #dc3545;
      text-align: center;
      min-height: 20px;
    }
    .demo-session {
      display: none;
      margin-top: 20px;
      padding: 14px;
      background: #f0f8ff;
      border: 1px solid #b3d9f2;
      border-radius: 8px;
      font-size: 12px;
      color: #2e86c1;
      word-break: break-all;
    }
    .demo-session code {
      display: block;
      margin-top: 4px;
      font-size: 11px;
    }
    .resume-btn {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 12px;
    }
    .resume-btn:hover {
      background: #1557b0;
    }
  </style>
</head>
<body>

  <div class="demo-header">
    <h1>Guest Check-In</h1>
    <p>Complete your onboarding in a simple conversation</p>
  </div>

  <div class="demo-card" id="startCard">
    <h2>Start Check-In</h2>
    <p class="sub">Enter your booking reference to begin the check-in process.</p>

    <div class="demo-field">
      <label for="bookingRef">Booking Reference</label>
      <input id="bookingRef" type="text" placeholder="e.g. BK-2024-12345" autocomplete="off">
    </div>

    <div class="demo-field">
      <label for="apiBase">API Base URL</label>
      <input id="apiBase" type="text" value="http://localhost:8000" placeholder="https://your-domain.com">
    </div>

    <button class="demo-btn" id="startBtn" onclick="startCheckIn()">Start Check-In</button>
    <div class="demo-status" id="statusMsg"></div>
    <div class="demo-session" id="sessionInfo"></div>
  </div>

  <script src="chat-widget.js"></script>
  <script>
    var widget = null;

    function startCheckIn() {
      var bookingRef = document.getElementById('bookingRef').value.trim();
      var apiBase    = document.getElementById('apiBase').value.trim().replace(/\/+$/, '');
      var btn        = document.getElementById('startBtn');
      var status     = document.getElementById('statusMsg');
      var sessionDiv = document.getElementById('sessionInfo');

      if (!bookingRef) {
        status.textContent = 'Please enter a booking reference.';
        return;
      }

      btn.disabled = true;
      status.textContent = 'Creating session...';
      sessionDiv.style.display = 'none';

      // POST /api/v1/sessions
      fetch(apiBase + '/api/v1/sessions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-API-Key': 'demo-key' },
        body: JSON.stringify({ booking_reference: bookingRef })
      })
      .then(function (resp) {
        if (!resp.ok) return resp.json().then(function (d) { throw new Error(d.detail || resp.statusText); });
        return resp.json();
      })
      .then(function (data) {
        var sessionId  = data.id;
        var token      = data.session_token;
        var wsProto    = location.protocol === 'https:' ? 'wss' : 'ws';
        var wsHost     = apiBase.replace(/^https?:\/\//, '');
        var wsUrl      = wsProto + '://' + wsHost + '/api/v1/ws/' + sessionId + '?token=' + encodeURIComponent(token);

        // Build widget config with existing session token/ID when resumed
        var widgetConfig = {
          sessionId: sessionId,
          token: token,
          wsUrl: wsUrl,
          apiUrl: apiBase + '/api/v1'
        };

        // Handle resumed sessions
        if (data.resumed) {
          if (data.existing_status === 'completed') {
            status.textContent = 'Your check-in is already complete!';
            status.style.color = '#1a73e8';
            sessionDiv.style.display = 'block';
            sessionDiv.innerHTML =
              '<strong>Session Complete</strong>' +
              '<code>ID: ' + sessionId + '</code>' +
              '<code>State: ' + data.current_state + '</code>';
            // Initialize widget so user can see chat history with arrival instructions
            widget = GuestCheckInWidget.init(widgetConfig);
            document.getElementById('gci-widget').classList.remove('gci-closed');
            document.getElementById('gci-fab').classList.add('gci-hidden');
            btn.textContent = 'Check-In Complete';
            return;
          } else if (data.existing_status === 'refused') {
            status.textContent = 'Your previous check-in was declined. You can resume to start over.';
            status.style.color = '#dc3545';
            sessionDiv.style.display = 'block';
            sessionDiv.innerHTML =
              '<strong>Session Refused</strong>' +
              '<code>ID: ' + sessionId + '</code>' +
              '<code>State: ' + data.current_state + '</code>';
            // Show resume button
            var resumeBtn = document.createElement('button');
            resumeBtn.textContent = 'Resume Check-In';
            resumeBtn.className = 'resume-btn';
            resumeBtn.onclick = function () {
              resumeBtn.disabled = true;
              resumeBtn.textContent = 'Resuming...';
              status.textContent = 'Resuming session...';
              status.style.color = '';
              // Call POST /sessions/{id}/resume to restart from INIT
              fetch(apiBase + '/api/v1/sessions/' + sessionId + '/resume', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-API-Key': 'demo-key' }
              })
              .then(function (resp) {
                if (!resp.ok) return resp.json().then(function (d) { throw new Error(d.detail || resp.statusText); });
                return resp.json();
              })
              .then(function (resumeData) {
                status.textContent = 'Session resumed! Starting check-in...';
                status.style.color = '#1a73e8';
                resumeBtn.remove();
                // Initialize widget — WebSocket will pick up the reset state
                widget = GuestCheckInWidget.init(widgetConfig);
                document.getElementById('gci-widget').classList.remove('gci-closed');
                document.getElementById('gci-fab').classList.add('gci-hidden');
                btn.textContent = 'Check-In In Progress';
              })
              .catch(function (err) {
                status.textContent = 'Error resuming: ' + err.message;
                resumeBtn.disabled = false;
                resumeBtn.textContent = 'Resume Check-In';
              });
            };
            document.querySelector('.demo-header').appendChild(resumeBtn);
            btn.textContent = 'Check-In Refused';
            return;
          }
          // Active session — just resume
          status.textContent = 'Resuming your check-in session...';
          status.style.color = '#1a73e8';
        }

        status.textContent = '';
        sessionDiv.style.display = 'block';
        sessionDiv.innerHTML =
          '<strong>Session Active</strong>' +
          '<code>ID: ' + sessionId + '</code>' +
          '<code>State: ' + data.current_state + '</code>';

        // Initialize widget
        widget = GuestCheckInWidget.init(widgetConfig);

        // Open widget immediately
        document.getElementById('gci-widget').classList.remove('gci-closed');
        document.getElementById('gci-fab').classList.add('gci-hidden');

        btn.textContent = 'Check-In In Progress';
      })
      .catch(function (err) {
        status.textContent = 'Error: ' + err.message;
        btn.disabled = false;
        btn.textContent = 'Start Check-In';
      });
    }
  </script>
</body>
</html>
