<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Verification Code</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f5f7;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 480px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .header {
      background-color: #1a73e8;
      padding: 28px 24px;
      text-align: center;
    }
    .header h1 {
      color: #ffffff;
      margin: 0;
      font-size: 22px;
      font-weight: 600;
    }
    .body {
      padding: 32px 24px;
      text-align: center;
    }
    .greeting {
      font-size: 16px;
      color: #333333;
      margin-bottom: 24px;
    }
    .otp-code {
      display: inline-block;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #1a73e8;
      background-color: #e8f0fe;
      border-radius: 8px;
      padding: 16px 32px;
      margin: 16px 0;
    }
    .expiry-notice {
      font-size: 14px;
      color: #5f6368;
      margin-top: 24px;
    }
    .footer {
      padding: 16px 24px 24px;
      text-align: center;
      font-size: 12px;
      color: #9aa0a6;
      border-top: 1px solid #e8eaed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Guest Check-In</h1>
    </div>
    <div class="body">
      <p class="greeting">Hello {{ guest_name }},</p>
      <p>Your verification code for check-in is:</p>
      <div class="otp-code">{{ otp_code }}</div>
      <p class="expiry-notice">
        This code expires in {{ expiry_minutes }} minutes.<br>
        If you did not request this code, please ignore this email.
      </p>
    </div>
    <div class="footer">
      Guest Check-In System &mdash; Secure Verification
    </div>
  </div>
</body>
</html>
